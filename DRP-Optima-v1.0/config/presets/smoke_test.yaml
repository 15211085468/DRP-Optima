# 冒烟测试配置（Smoke Test Preset）
# 用途：快速验证代码是否正确安装、环境是否能正常训练
# 特点：小规模、快速出结果、密集日志

# ============= 环境参数 =============
env:
  # --- 规模参数（小规模） ---
  num_skus: 10                    # 仅10个SKU（快速验证）
  num_stores: 1                   # 仅1个门店（简化环境）
  max_storage_capacity: 500       # 小仓库（快速溢出测试）
  
  # --- 业务参数（激进化，快速看到效果） ---
  holding_cost_per_unit_weekly: 0.5   # 持有成本（标准）
  shortage_penalty_per_unit: 12.0     # 高缺货惩罚（快速学习）
  fixed_cost_per_order: 0.0          # 移除固定成本（业务修正）
  
  # --- 高级特性（全部启用） ---
  enable_abc_reward: true
  enable_pbrs: true
  enable_constraints: true
  use_dynamic_normalization: true
  
  # --- 满足率阶梯奖励（启用） ---
  enable_service_level_bonus: true
  sl_bonus_threshold_1: 0.90
  sl_bonus_reward_1: 30.0
  sl_bonus_threshold_2: 0.95
  sl_bonus_reward_2: 150.0
  sl_penalty_threshold: 0.85
  sl_penalty_reward: -50.0
  
  # --- Action Masking（启用） ---
  enable_action_masking: true
  action_masking_multiplier: 1.2

# ============= PPO参数 =============
ppo:
  # --- 训练控制（快速出结果） ---
  total_timesteps: 50000          # 仅5万步（快速验证）
  log_interval: 10                # 每10步打印日志（密集监控）
  
  # --- 算法参数（简化） ---
  n_steps: 2048                   # 缩短采样步长
  batch_size: 64                  # 小批次
  policy_lr: 1e-4                 # 保守学习率
  gamma: 0.995                    # 长期主义
  gae_lambda: 0.98
  
  # --- 评估参数（快速验证） ---
  eval_freq: 5000                 # 每5000步评估一次
  eval_episodes: 5                # 5个episode（快速评估）
  
  # --- 其他参数 ---
  vf_coef: 0.8                    # 加强Value拟合
  ent_coef: 0.03                  # 鼓励探索
  max_grad_norm: 0.5              # 防止梯度爆炸

# ============= 日志与调试 =============
logging:
  level: "DEBUG"                  # 详细日志（方便排查）
  log_freq: 100                   # 每100步记录一次

# ============= 预期结果 =============
# 训练完成后，应看到：
# 1. value_loss 平稳下降（无NaN）
# 2. [Action Masking] 日志频繁触发（物理外挂生效）
# 3. current_sl (满足率) ≥ 85%（底线验证）
# 4. exponential_penalty 断崖式下降（PPO学会避免缺货）
# 5. sl_bonus 出现 30.0 或 150.0（冲刺95%满足率）
