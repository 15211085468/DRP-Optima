# DRP-Optima 训练配置示例
# 使用方法: python train.py --config config/train.yaml

# ========= 路径配置 =========
paths:
  project_root: "."  # 项目根目录（相对或绝对路径）
  data_path: "C:/OuNingyi/21级工程管理欧宁益/论文基础数据/main.csv"
  inventory_path: "C:/OuNingyi/21级工程管理欧宁益/论文基础数据/shop_stock.csv"
  output_dir: "output"
  models_dir: "models"
  log_dir: "logs"

# ========= 数据配置 =========
data:
  sku_limit: 50  # SKU数量限制（默认50，完整数据集约500+）
  store_limit: 10  # 门店数量限制（默认10，完整数据集约100+）
  test_size: 0.2  # 测试集比例
  random_seed: 42  # 随机种子

# ========= TFT 模型配置 =========
tft:
  hidden_size: 64  # 隐藏层大小
  attention_head_size: 4  # 注意力头数
  dropout: 0.1  # Dropout率
  max_epochs: 20  # 最大训练轮数
  batch_size: 128  # 批次大小
  learning_rate: 1e-3  # 学习率

# ========= PPO 配置 =========
ppo:
  total_timesteps: 50000  # 总训练步数（小规模验证用50000，完整训练用1000000+）
  n_steps: 2048  # 每次更新收集的样本数
  batch_size: 512  # 批次大小
  policy_lr: 5e-5  # 策略学习率
  value_lr: 1e-4  # 价值函数学习率
  vf_coef: 1.0  # 价值函数系数
  ent_coef: 0.01  # 熵系数
  gamma: 0.99  # 折扣因子
  gae_lambda: 0.95  # GAE参数
  clip_range: 0.2  # PPO裁剪范围

# ========= 环境配置 =========
env:
  lead_time: 7  # 提前期（天）
  warehouse_capacity: 100.0  # 仓库容量（每SKU）
  service_level_target: 0.95  # 目标服务水平
  reward_scale: 1.0  # 奖励缩放因子

# ========= 日志配置 =========
logging:
  level: "INFO"  # 日志级别（DEBUG/INFO/WARNING/ERROR）
  save_tensorboard: true  # 是否保存TensorBoard日志
  save_monitor_csv: true  # 是否保存训练监控CSV
  print_every: 1000  # 每隔N步打印一次日志
