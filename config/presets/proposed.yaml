# 预设模式：proposed（95%满足率突破版）
# 用途：专门优化订单满足率至95%+，使用三层漏斗式策略

env:
  # ========== 第一层：Reward重塑（决定性因素，80%权重） ==========
  
  # --- 成本与惩罚 (大棒) ---
  holding_cost_per_unit_weekly: 0.25       # 🔥 降低持有成本（鼓励建安全库存）
  shortage_penalty_per_unit: 12.0          # 🔥 线性基础惩罚拉高（单件毛利的3-5倍）
  shortage_exponent: 1.5                   # 🆕 指数惩罚（缺货越多，惩罚几何级数爆炸）
  fixed_cost_per_order: 2.0                # 🔥 降低固定成本（鼓励高频小批量补货）
  
  # --- 奖励与特性 (胡萝卜) ---
  enable_abc_reward: true
  enable_pbrs: true
  enable_constraints: true
  use_dynamic_normalization: true          # 🚨 必须开启！Reward方差极大，必须归一化
  
  # --- 满足率阶梯奖金（悬崖式阈值奖励） ---
  enable_service_level_bonus: true
  sl_bonus_threshold_1: 0.90               # 90% 满足率
  sl_bonus_reward_1: 30.0                  # 中奖
  sl_bonus_threshold_2: 0.95               # 🎯 95% 目标满足率
  sl_bonus_reward_2: 150.0                 # 🔥 巨额奖金（无法拒绝）
  sl_penalty_threshold: 0.85               # 低于 85% 倒扣
  sl_penalty_reward: -50.0                 # 重罚
  
  # --- 安全库存参数 ---
  safety_stock_factor: 2.33                # 99%服务水平（z=2.33）
  min_service_level: 0.95                  # 最低满足率要求
  
  # --- 预测先验（需求可见性） ---
  forecast_horizon: 7                      # 预测未来7天需求
  use_forecast_in_state: true              # 将预测拼接到State向量
  
  # ========== 第二层：动作空间与约束（物理外挂，15%权重） ==========
  
  # --- Action Masking（动作掩码） ---
  enable_action_masking: true              # 🔥 启用Action Masking
  safety_stock_mask_threshold: 1.2         # 库存低于1.2倍安全库存时，强制补货
  max_order_quantity_ratio: 2.0            # 单次补货上限（未来2周需求）
  min_order_frequency: 1                   # 最少每1周补货一次（防止"躺平"）

ppo:
  # ========== 第三层：PPO算法超参（催化剂，5%权重） ==========
  
  # --- 长期主义参数 ---
  total_timesteps: 2000000                 # 🔥 200万步（确保充分探索）
  gamma: 0.995                             # 🔥 极度看重长期收益（核心调整）
  gae_lambda: 0.98                         # 配合高gamma，增加优势函数平滑度
  
  # --- 探索与收敛 ---
  ent_coef: 0.03                           # 前期鼓励探索
  vf_coef: 0.8                             # 🔥 加强对大额阶梯奖金的Value拟合
  clip_range: 0.2                          # 保守更新
  
  # --- 训练稳定性 ---
  n_epochs: 15                             # 增加数据复用次数
  n_steps: 4096                            # 🔥 增大采样步数（长期任务）
  batch_size: 256                          # 🔥 GPU优化：调大批次（RTX 4060 Ti 8GB显存）
  policy_lr: 0.0003                        # 精细调优
  
  # --- 其他参数 ---
  max_grad_norm: 0.5                       # 防止梯度爆炸
  use_sde: false                           # 不使用状态依赖探索
